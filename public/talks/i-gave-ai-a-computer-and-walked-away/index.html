<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>I Gave AI a Computer and Walked Away · msomu</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/theme/black.css"
    />
    <style>
      :root {
        --orange: #f97316;
        --orange-dim: #c2540a;
        --bg: #0a0a0a;
        --surface: #141414;
        --border: #262626;
        --text: #e5e5e5;
        --muted: #737373;
      }

      .reveal-viewport {
        background: var(--bg);
      }

      .reveal {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--text);
      }

      .reveal h1,
      .reveal h2,
      .reveal h3 {
        font-weight: 600;
        letter-spacing: -0.03em;
        text-transform: none;
        color: #fff;
        text-shadow: none;
      }

      .reveal h1 { font-size: 2.2em; line-height: 1.1; }
      .reveal h2 { font-size: 1.7em; line-height: 1.15; }
      .reveal p { color: var(--text); line-height: 1.5; font-size: 0.95em; }

      .reveal section {
        text-align: left;
      }

      .slide-title,
      .slide-word {
        text-align: center;
        display: flex !important;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100% !important;
        box-sizing: border-box;
      }

      .slide-title h1 {
        font-size: 2.1em;
        max-width: 18ch;
        margin: 0 auto 0.45em;
      }

      .slide-title .orange { color: var(--orange); }

      .slide-title .meta {
        font-size: 0.62em;
        color: var(--muted);
        margin-top: 1em;
        font-weight: 500;
        text-align: center;
      }

      .slide-title .meta strong {
        color: var(--text);
        font-weight: 600;
      }

      .slide-word h1 {
        font-size: 4.4em;
        margin: 0;
        letter-spacing: -0.04em;
      }

      .slide-tools p {
        margin: 0;
        font-size: 2.4em;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.03em;
        color: #fff;
      }

      .reveal footer {
        position: fixed;
        bottom: 1.2em;
        right: 1.4em;
        font-size: 0.45em;
        color: var(--muted);
        font-weight: 500;
        z-index: 100;
      }

      .reveal .slides section { padding: 0.8em 1.5em; }

      @media (max-width: 639px) {
        .slide-title h1 { font-size: 1.28em; max-width: 10ch; margin-bottom: 0.4em; }
        .slide-title .meta { font-size: 0.58em; margin-top: 0.55em; color: #a3a3a3; }
        .slide-word h1 { font-size: 2.6em; }
        .slide-tools p { font-size: 1.55em; }
        .reveal footer,
        .reveal .controls { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="reveal">
      <footer>msomu · United by AI · Sep 2026</footer>
      <div class="slides">

        <!-- 01 Title. Cue 11:45 to 11:48: read the unpopular line. Name Sid. Switch to Pi. -->
        <section class="slide-title">
          <h1>I Gave AI a <span class="orange">Computer</span> and Walked Away</h1>
          <p class="meta">
            <strong>Somu</strong><br />
            Chennai AI Builders #2 · 12 Sep 2026 · Freshworks
          </p>
        </section>

        <!-- 02 Loop. Cue 11:48: map, not the show. Open packages/agent. -->
        <section class="slide-word">
          <h1>Loop</h1>
        </section>

        <!-- 03 One turn. Cue 11:53: prefer the cursor in Pi. -->
        <section class="slide-word">
          <h1>One turn</h1>
        </section>

        <!-- 04 Four tools. Cue about 12:00: point at packages/coding-agent. Hide after. -->
        <section class="slide-word slide-tools">
          <p>read<br />write<br />edit<br />bash</p>
        </section>

        <!-- 05 Walk away. Cue 12:07: isolation, stop, proof. Then Buzz at 12:17. -->
        <section class="slide-word">
          <h1>Walk away</h1>
        </section>

        <!-- 06 Verify. Cue 12:27: leave this up. Sit down. -->
        <section class="slide-word">
          <h1>Verify</h1>
        </section>

      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.js"></script>
    <script>
      const phone = window.innerWidth < 640;
      Reveal.initialize({
        hash: true,
        transition: "fade",
        transitionSpeed: "fast",
        controls: true,
        progress: true,
        center: false,
        width: phone ? 390 : 1100,
        height: phone ? 844 : 700,
        margin: phone ? 0.08 : 0.06,
        minScale: 0.5,
        maxScale: 1.4,
      });
    </script>
  </body>
</html>
